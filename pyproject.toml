[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "cfn2iam"
dynamic = ["version"]
description = "Generate the IAM policy a CloudFormation stack needs, from its template, before you deploy it."
readme = "README.md"
authors = [
    {name = "S Murali Krishnan", email = "mrlikrsh@gmail.com"}
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Utilities",
]
license-files = ["LICENSE"]
keywords = ["aws", "cloudformation", "sam", "iam", "permissions", "least-privilege"]
dependencies = [
    "PyYAML>=6.0.3",
    "typer>=0.21.1"
]
requires-python = ">=3.9"

[project.optional-dependencies]
iam = ["boto3>=1.26"]

[project.urls]
Homepage = "https://github.com/mrlikl/cfn2iam"
Issues = "https://github.com/mrlikl/cfn2iam/issues"
"Web version" = "https://mrlikl.github.io/cfn2iam/"

[project.scripts]
cfn2iam = "cfn2iam.app:app"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["cfn2iam"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
