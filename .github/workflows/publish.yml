name: Publish

# Keep this filename: PyPI's trusted publisher for cfn2iam is tied to it.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing (OIDC), no stored token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs derives the version from tags
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv build
      - name: Check the built version matches the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ls dist/
          test -f "dist/cfn2iam-${TAG#v}-py3-none-any.whl" || { echo "Built version does not match tag ${TAG}"; exit 1; }
      - run: uv publish
