name: Publish

# Keep this filename: PyPI's trusted publisher for cfn2iam is tied to it.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing (OIDC), no stored token
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # hatch-vcs derives the version from tags
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv build
      - name: Check the built version matches the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ls dist/
          test -f "dist/cfn2iam-${TAG#v}-py3-none-any.whl" || { echo "Built version does not match tag ${TAG}"; exit 1; }
      - run: uv publish
