name: Test

# The full gate: lint, tests on every supported Python and OS, the cfn2iam[iam] extra, the
# built distributions, the installed CLI, and the core that the web version runs in Pyodide.
# publish.yml calls this workflow and uploads the exact dist/ its build job produced.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels its superseded run. Pushes to main and release runs
  # (called from publish.yml on a tag) are never cancelled part way.
  group: test-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# setup-uv caches uv's downloads on GitHub-hosted runners, keyed on uv.lock and pyproject.toml.
# It skips the cache on tag pushes, so a release never restores what an earlier run saved.

jobs:
  lint:
    name: Lint, format and lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: uv.lock matches pyproject.toml
        run: uv lock --check
      - name: ruff check
        run: uv run --locked --only-dev ruff check --output-format=github .
      - name: ruff format
        run: uv run --locked --only-dev ruff format --check --diff .

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Every released Python that requires-python (>=3.11) allows, on Linux.
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        # The CLI reads templates and writes policy files, so run the oldest and newest
        # Python on macOS and Windows too (paths, default file encoding, line endings).
        include:
          - { os: macos-latest, python-version: "3.11" }
          - { os: macos-latest, python-version: "3.15" }
          - { os: windows-latest, python-version: "3.11" }
          - { os: windows-latest, python-version: "3.15" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs derives the version from tags
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run --locked pytest -q -rs

  iam:
    name: Test with cfn2iam[iam] (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra iam
      - name: The boto3 code paths import
        run: >-
          uv run --locked --extra iam python -c
          "import boto3, botocore.exceptions, botocore.stub; from cfn2iam import app; assert app._has_boto3()"
      # Includes tests/test_iam_extra.py, which is skipped when boto3 isn't installed.
      - run: uv run --locked --extra iam pytest -q -rs

  build:
    name: Build and check distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs derives the version from tags
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build
      - name: twine check
        # In its own environment, so twine's dependencies never enter the project's lock.
        run: uvx twine@7.0.0 check --strict dist/*
      - name: The wheel holds the core and the CLI
        run: |
          python3 -m zipfile -l dist/*.whl
          python3 -m zipfile -l dist/*.whl | grep -q 'cfn2iam/core.py'
          python3 -m zipfile -l dist/*.whl | grep -q 'cfn2iam/app.py'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  wheel:
    name: Installed CLI (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.15"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # only for samples/
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Install the wheel into a clean virtual environment
        # Dependencies resolve from PyPI within the wheel's metadata, as for a user; uv.lock isn't used.
        run: |
          venv="$RUNNER_TEMP/venv"
          uv venv "$venv"
          uv pip install --python "$venv" dist/*.whl
          if [ "$RUNNER_OS" = Windows ]; then echo "$venv/Scripts" >> "$GITHUB_PATH"; else echo "$venv/bin" >> "$GITHUB_PATH"; fi
      - name: Run the CLI on samples/
        # Fetches the published schemas from mrlikl.github.io, as every real run does.
        run: |
          wheel=$(basename dist/*.whl)
          expected="cfn2iam $(echo "$wheel" | cut -d- -f2)"
          mkdir "$RUNNER_TEMP/run" && cd "$RUNNER_TEMP/run" # away from the checkout's cfn2iam/
          actual=$(cfn2iam --version | tr -d '\r')
          echo "$actual"
          [ "$actual" = "$expected" ] || { echo "::error::cfn2iam --version printed '$actual', expected '$expected'"; exit 1; }
          for template in cfn.json sam.yaml; do
            rm -f policy-*.json
            cfn2iam "$GITHUB_WORKSPACE/samples/$template"
            python -I -c 'import glob, json; [f] = glob.glob("policy-*.json"); s = json.load(open(f))["Statement"]; assert s and all(x["Action"] for x in s), s; print(f, [(x["Effect"], len(x["Action"])) for x in s])'
          done
          # The comparison, through the installed entry point: 0 for no drift.
          cfn2iam "$GITHUB_WORKSPACE/samples/cfn.json" --format json -o cfn.json
          cfn2iam diff cfn.json --baseline cfn.json
      - name: Run the CLI on samples/ with resource scoping
        # Also fetches the published Service Authorization Reference (servicereference/).
        run: |
          mkdir "$RUNNER_TEMP/scoped" && cd "$RUNNER_TEMP/scoped"
          for template in cfn.json sam.yaml; do
            rm -f policy-*.json
            cfn2iam "$GITHUB_WORKSPACE/samples/$template" --account 123456789012 --region us-east-1
            # shellcheck disable=SC2016 # a literal ${ in the Python check
            python -I -c 'import glob, json; [f] = glob.glob("policy-*.json"); s = json.load(open(f))["Statement"]; arns = [r for x in s if x["Effect"] == "Allow" for r in ([x["Resource"]] if isinstance(x["Resource"], str) else x["Resource"]) if r != "*"]; assert arns and all(r.count(":") >= 5 and "${" not in r for r in arns), s; assert all(x["Resource"] == "*" for x in s if x["Effect"] == "Deny"), s; print(f, len(s), "statements,", len(arns), "ARNs")'
          done

  core:
    name: Core without CLI dependencies (CPython and Pyodide)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Keep in step with PYODIDE_VERSION in the web version (mrlikl.github.io, cfn2iam/app.js).
      PYODIDE_VERSION: "314.0.7"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # only for tests/pyodide/
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14" # the Python in Pyodide 314
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Import and run cfn2iam.core with only PyYAML installed
        run: |
          venv="$RUNNER_TEMP/core-only"
          uv venv "$venv"
          uv pip install --python "$venv" --no-deps dist/*.whl
          uv pip install --python "$venv" PyYAML
          cd "$RUNNER_TEMP"
          "$venv/bin/python" -I - <<'EOF'
          import asyncio, importlib.util, sys
          for name in ("typer", "click", "boto3"):
              assert importlib.util.find_spec(name) is None, f"{name} is installed, so this check proves nothing"
          from cfn2iam import core
          schema = {"handlers": {"create": {"permissions": ["s3:CreateBucket"]}, "delete": {"permissions": ["s3:DeleteBucket"]}}}
          def fetch_json(path):
              if path == "schemas/AWS_S3_Bucket.json":
                  return schema
              raise core.NotFound(path)
          analysis = asyncio.run(core.analyze_template("Resources: {B: {Type: AWS::S3::Bucket}}", fetch_json))
          assert analysis.allow == ["s3:CreateBucket"] and analysis.delete == ["s3:DeleteBucket"], analysis
          loaded = sorted(m for m in ("typer", "click", "boto3", "urllib.request", "cfn2iam.app") if m in sys.modules)
          assert not loaded, f"cfn2iam.core pulled in {loaded}"
          print("cfn2iam.core OK with only PyYAML")
          EOF
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install the wheel in Pyodide with micropip and run the core
        run: |
          npm install --no-save --no-audit --no-fund --ignore-scripts --prefix "$RUNNER_TEMP/pyodide" "pyodide@$PYODIDE_VERSION"
          node tests/pyodide/smoke.mjs "$RUNNER_TEMP/pyodide/node_modules/pyodide" dist/*.whl

  # The GitHub Action (action.yml at the root), run as a user runs it, against samples/ and
  # tests/fixtures/action/. Its token is read-only (contents: read, and this workflow is also
  # called from publish.yml), so on a pull request the comment attempt is refused, which tests
  # the fork and Dependabot path. action-comment.yml tests posting the comment.
  #
  # drift-baseline.json is a hand-written deploy role policy for samples/cfn.json: S3 and one
  # unused SQS action, DynamoDB only under a condition, IAM only for some roles, no Lambda.
  # Service wildcards keep the outcome stable when the weekly schema refresh adds actions.
  action:
    name: GitHub Action
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "First run: no baseline yet"
        id: first
        uses: ./
        with:
          templates: samples/cfn.json
          baseline: ${{ runner.temp }}/baselines/cfn.json
          name: first run
      - name: The first run explains and passes
        env:
          OUT: ${{ toJSON(steps.first.outputs) }}
        run: |
          echo "$OUT"
          jq -e '.["baseline-status"] == "missing" and .drift == "false" and .error == "false" and .["added-count"] == "0" and .commented == "false"' <<< "$OUT"
          grep -q 'Start checking' "$(jq -r '.["report-path"]' <<< "$OUT")"
          jq -e '.Statement[0].Action | index("lambda:CreateFunction")' "$(jq -r '.["policy-path"]' <<< "$OUT")"
          [ ! -e "$RUNNER_TEMP/baselines/cfn.json" ]

      - name: "Accept: write the baseline"
        id: accept
        uses: ./
        with:
          templates: samples/cfn.json
          baseline: ${{ runner.temp }}/baselines/cfn.json
          update-baseline: true
          comment: never
      - name: The baseline is the generated policy, and the outputs describe it
        env:
          POLICY: ${{ steps.accept.outputs.policy-path }}
          OUT: ${{ toJSON(steps.accept.outputs) }}
        run: |
          cmp "$POLICY" "$RUNNER_TEMP/baselines/cfn.json"
          jq -e '.["baseline-updated"] == "true" and .drift == "false" and .error == "false"' <<< "$OUT"

      - name: "Accept a change: update a baseline that drifted"
        run: |
          mkdir -p "$RUNNER_TEMP/drifted"
          cp tests/fixtures/action/drift-baseline.json "$RUNNER_TEMP/drifted/policy.json"
      - id: update-drifted
        uses: ./
        with:
          templates: samples/cfn.json
          baseline: ${{ runner.temp }}/drifted/policy.json
          update-baseline: true
          comment: never
      - name: After the update, no drift is reported
        env:
          OUT: ${{ toJSON(steps.update-drifted.outputs) }}
        run: |
          echo "$OUT"
          jq -e '.drift == "false" and .["added-count"] == "0" and .["baseline-updated"] == "true" and .["baseline-status"] == "found"' <<< "$OUT"
          # The report still says what the update accepted.
          grep -q 'Permission drift' "$(jq -r '.["report-path"]' <<< "$OUT")"

      - name: "No drift: the baseline grants what the template needs"
        id: same
        uses: ./
        with:
          templates: samples/cfn.json
          baseline: ${{ runner.temp }}/baselines/cfn.json
          comment: never
          name: no drift
      - name: Nothing changed
        env:
          OUT: ${{ toJSON(steps.same.outputs) }}
        run: |
          jq -e '.["baseline-status"] == "found" and .drift == "false" and .["added-count"] == "0" and .["removed-count"] == "0"' <<< "$OUT"
          grep -q 'No permission changes' "$(jq -r '.["report-path"]' <<< "$OUT")"

      - name: "Drift, reported without failing"
        id: drift
        uses: ./
        with:
          templates: samples/cfn.json
          baseline: tests/fixtures/action/drift-baseline.json
          fail-on-drift: false
          comment: never
          name: drift
      - name: The action reported the drift
        env:
          OUT: ${{ toJSON(steps.drift.outputs) }}
        run: |
          echo "$OUT"
          jq -e '.drift == "true" and (.["added-count"] | tonumber) > 0 and .["removed-count"] == "1" and (.["conditional-count"] | tonumber) > 0' <<< "$OUT"
          report=$(jq -r '.["report-path"]' <<< "$OUT")
          # shellcheck disable=SC2016 # literal backticks
          grep -q '`lambda:CreateFunction`' "$report"
          grep -q 'TablesInOneRegion' "$report"
          grep -q 'sqs' "$report"

      - name: "Drift, failing the step"
        id: drift-fail
        continue-on-error: true
        uses: ./
        with:
          templates: samples/cfn.json
          baseline: tests/fixtures/action/drift-baseline.json
          comment: never
      - name: The step failed, with its outputs set
        env:
          OUTCOME: ${{ steps.drift-fail.outcome }}
          DRIFT: ${{ steps.drift-fail.outputs.drift }}
        run: '[ "$OUTCOME" = failure ] && [ "$DRIFT" = true ]'

      - name: "Several templates, with a glob: write the baseline"
        id: multi-accept
        uses: ./
        with:
          templates: |
            samples/cfn.json
            samples/*.yaml
          baseline: ${{ runner.temp }}/baselines/all.json
          update-baseline: true
          comment: never
      - name: "Several templates: check them against it"
        id: multi
        uses: ./
        with:
          templates: |
            samples/cfn.json
            samples/*.yaml
          baseline: ${{ runner.temp }}/baselines/all.json
          comment: never
      - name: The policies were combined
        env:
          OUT: ${{ toJSON(steps.multi.outputs) }}
        run: |
          jq -e '.drift == "false" and .["added-count"] == "0"' <<< "$OUT"
          jq -e '[.Statement[0].Action[] | select(startswith("lambda:") or startswith("states:"))] | map(split(":")[0]) | unique == ["lambda", "states"]' "$RUNNER_TEMP/baselines/all.json"
          # shellcheck disable=SC2016 # literal backticks
          grep -q 'Templates: `samples/cfn.json`, `samples/sam.yaml`' "$(jq -r '.["report-path"]' <<< "$OUT")"

      - name: "Resource scoping: against the unscoped baseline"
        id: scoped
        uses: ./
        with:
          templates: samples/cfn.json
          baseline: ${{ runner.temp }}/baselines/cfn.json
          account: "123456789012"
          region: us-east-1
          comment: never
          name: scoped
      - name: "Resource scoping: a scoped baseline"
        id: scoped-accept
        uses: ./
        with:
          templates: samples/cfn.json
          baseline: ${{ runner.temp }}/baselines/scoped.json
          account: "123456789012"
          region: us-east-1
          update-baseline: true
          comment: never
      - name: "Resource scoping: the unscoped policy against the scoped baseline"
        id: unscoped-vs-scoped
        uses: ./
        with:
          templates: samples/cfn.json
          baseline: ${{ runner.temp }}/baselines/scoped.json
          fail-on-drift: false
          comment: never
      - name: A "*" baseline covers scoped ARNs, and a scoped baseline grants "*" only conditionally
        env:
          SCOPED: ${{ toJSON(steps.scoped.outputs) }}
          UNSCOPED: ${{ toJSON(steps.unscoped-vs-scoped.outputs) }}
        run: |
          jq -e '.drift == "false" and .["added-count"] == "0"' <<< "$SCOPED"
          # shellcheck disable=SC2016 # literal backticks
          grep -q 'Resources scoped to account `123456789012`, region `us-east-1`' "$(jq -r '.["report-path"]' <<< "$SCOPED")"
          jq -e '[.Statement[] | select(.Effect == "Allow") | .Resource | if type == "string" then [.] else . end | .[] | select(startswith("arn:aws:"))] | length > 0' "$RUNNER_TEMP/baselines/scoped.json"
          jq -e '.drift == "true" and (.["conditional-count"] | tonumber) > 0' <<< "$UNSCOPED"

      - name: "Custom resources are reported as skipped"
        id: custom
        uses: ./
        with:
          templates: tests/fixtures/action/custom-resource.yaml
          comment: never
          name: custom
      - name: The report and the comment name the custom resource
        env:
          OUT: ${{ toJSON(steps.custom.outputs) }}
        run: |
          report=$(jq -r '.["report-path"]' <<< "$OUT")
          grep -q 'Skipped 1 custom resource: Seed (Custom::SeedQueue)' "$report"
          grep -q 'Skipped 1 custom resource: Seed (Custom::SeedQueue)' "$(dirname "$report")/comment.md"

      - name: "A comment cut to fit, under a name with markup"
        id: short
        uses: ./
        env:
          CFN2IAM_ACTION_COMMENT_LIMIT: "4000"
        with:
          templates: samples/cfn.json
          baseline: tests/fixtures/action/drift-baseline.json
          fail-on-drift: false
          comment: never
          name: "prod --> <b>x</b>"
      - name: The comment says it was shortened, and its marker is intact
        env:
          OUT: ${{ toJSON(steps.short.outputs) }}
        run: |
          comment="$(dirname "$(jq -r '.["report-path"]' <<< "$OUT")")/comment.md"
          head -n 1 "$comment"
          [ "$(head -n 1 "$comment")" = '<!-- cfn2iam-action:prod --%3E %3Cb%3Ex%3C/b%3E -->' ]
          [ "$(wc -c < "$comment")" -le 4000 ]
          grep -q "This comment is shortened to fit GitHub's size limit" "$comment"
          grep -q 'The generated policy is left out of this comment for length' "$comment"
          # The job summary keeps everything.
          grep -q '"Version": "2012-10-17"' "$(jq -r '.["report-path"]' <<< "$OUT")"

      - name: "Error: an invalid input to the install step"
        id: bad-input
        continue-on-error: true
        uses: ./
        with:
          templates: samples/cfn.json
          registry-fallback: "yes"
          comment: never
      - name: "Error: cfn2iam can't be installed (no such Python)"
        id: bad-python
        continue-on-error: true
        uses: ./
        with:
          templates: samples/cfn.json
          python-version: "3.10"
          comment: never
      - name: Both failed with the error output set
        env:
          BAD_INPUT: ${{ toJSON(steps.bad-input) }}
          BAD_PYTHON: ${{ toJSON(steps.bad-python) }}
        run: |
          echo "$BAD_INPUT"; echo "$BAD_PYTHON"
          jq -e '.outcome == "failure" and .outputs.error == "true"' <<< "$BAD_INPUT"
          jq -e '.outcome == "failure" and .outputs.error == "true"' <<< "$BAD_PYTHON"

      - name: "Error: a template that does not exist"
        id: no-template
        continue-on-error: true
        uses: ./
        with:
          templates: samples/missing.yaml
          comment: never
      - name: "Error: a resource type no schema knows"
        id: unresolved
        continue-on-error: true
        uses: ./
        with:
          templates: tests/fixtures/action/unresolved.yaml
          comment: never
      - name: Both failed, and said why
        env:
          NO_TEMPLATE: ${{ toJSON(steps.no-template) }}
          UNRESOLVED: ${{ toJSON(steps.unresolved) }}
        run: |
          jq -e '.outcome == "failure" and .outputs.error == "true"' <<< "$NO_TEMPLATE"
          # shellcheck disable=SC2016 # literal backticks
          grep -q 'Template `samples/missing.yaml` does not exist' "$(jq -r '.outputs["report-path"]' <<< "$NO_TEMPLATE")"
          jq -e '.outcome == "failure" and .outputs.error == "true"' <<< "$UNRESOLVED"
          grep -q 'MyOrg::Fake::Thing' "$(jq -r '.outputs["report-path"]' <<< "$UNRESOLVED")"

  # The action on macOS and Windows: the install, paths, and the outputs.
  action-os:
    name: GitHub Action (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: accept
        uses: ./
        with:
          templates: samples/*.yaml
          baseline: ${{ runner.temp }}/baseline.json
          update-baseline: true
          comment: never
      - id: check
        uses: ./
        with:
          templates: samples/*.yaml
          baseline: ${{ runner.temp }}/baseline.json
          comment: never
      - name: No drift
        shell: bash
        env:
          OUT: ${{ toJSON(steps.check.outputs) }}
        run: jq -e '.["baseline-status"] == "found" and .drift == "false"' <<< "$OUT"

  # One stable check for branch protection to require, however the matrices above change.
  ok:
    name: All checks passed
    if: always()
    needs: [lint, test, iam, build, wheel, core, action, action-os]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
